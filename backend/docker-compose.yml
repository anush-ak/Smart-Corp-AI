# SmartCorp AI — local Docker stack (PostgreSQL + pgvector, Redis, API).
# Phase 1 is verified with SQLite locally; this file keeps the architecture
# Docker-ready and is exercised fully from Phase 4 (pgvector) onwards.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: smartcorp
      POSTGRES_PASSWORD: smartcorp
      POSTGRES_DB: smartcorp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartcorp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_SECRET_KEY: dev-docker-change-me
      DATABASE_URL: postgres://smartcorp:smartcorp@db:5432/smartcorp
      REDIS_URL: redis://redis:6379/0
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: .
    command: celery -A config worker --loglevel=info
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: postgres://smartcorp:smartcorp@db:5432/smartcorp
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis

volumes:
  pgdata:
